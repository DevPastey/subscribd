name: Preview - Staging CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      trigger_build:
        description: 'Trigger EAS Build for preview (APK/Internal iOS)?'
        required: true
        type: boolean
        default: false
      platform:
        description: 'Platform to build (if trigger_build is true)'
        required: true
        type: choice
        options:
          - all
          - android
          - ios
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🏷️ Run TypeScript type check
        run: npm run typecheck

      - name: 🧪 Run Unit Tests
        run: npm run test:ci

  eas-update-preview:
    name: Publish EAS Update (Preview)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ⚙️ Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Publish OTA Update to Preview Channel
        run: |
          eas update --channel preview --message "${{ github.event.head_commit.message || 'Manual preview update' }}" --non-interactive

  eas-build-preview:
    name: Build Preview Binaries (EAS)
    needs: validate
    if: ${{ github.event.inputs.trigger_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ⚙️ Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Trigger EAS Build (Preview Profile)
        run: |
          eas build --profile preview --platform ${{ github.event.inputs.platform || 'all' }} --non-interactive --no-wait
